<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
      const BLOBS = [
        "jvPyYem9fuUtUdWodYNPPJm8bgG1Hhr7uTWspmGV7d2oLoM3Di/UuAFAbLIHTIYTYx0S4HdJB3XQ4Wru",
        "FxxnK0SYXjClHUgX+sU1u+EyFfgucxRyml/6KxL2gnFZfak9FpytxyKj8YBPvygKxfrAvEwcF+uC08B4",
        "cwWTnS6b+8DubcByKkANTcjFGo9gIhoDO+0ausnMlyerdtpWBed67i/k+M+ZUR7MzPGnnBRHGofoRZcH",
        "+QbvdiasyI5S0F+tMnh4nGRwRhqyAQR1mM+PCYDLhrg2yhTjqr0+4S/UhL3sq1Vm51tSgxy6DpKl9/+Y",
        "kI2WsR+kuQCnM8l/4jvjd7U7Z/Z3kELkjJaO159oYBy6jKkBb8s1OAnYUQfRW4S5jlk71ymiO8WOrCeS",
        "cV52l6t59rnOmCl4KxNdeQoOxI1rLpWzPBd0jkGwimJ9CPtn1H6gRT8Zq9222m43CYjb//lANhI4arg/",
        "shusyX3aspdAQQ7riUCUyGQFVeM+ZHG1NLyWOpFgPX+nn4Ys57n/hL9fCEedelTjh1VNknzeocc2kMI+",
        "xqCvtXg6POGr88ktLwAuCLQgQ18j7l8Y5UR6N8WMVAETdES9OlkxB5qrMv5MHNDhMLHiJQvbfV+QFtHp"
      ];

      function normalize(code) {
        return code.toUpperCase().replace(/[\s-]/g, "");
      }

      function fromBase64(s) {
        return Uint8Array.from(atob(s), c => c.charCodeAt(0));
      }

      async function keyFromCode(code) {
        const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(normalize(code)));
        return crypto.subtle.importKey("raw", hash, "AES-GCM", false, ["decrypt"]);
      }

      // try the code against every blob; AES-GCM only accepts the right key
      async function reveal(code) {
        const key = await keyFromCode(code);
        for (const blob of BLOBS) {
          const bytes = fromBase64(blob);
          try {
            const plain = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
            const [gifter, recipient] = new TextDecoder().decode(plain).replace(/\0+$/, "").split("\n");
            return { gifter, recipient };
          } catch {
            // not this person's blob, try the next one
          }
        }
        return null;
      }

      // this script is in <head>, so wait for the form to exist
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("form").addEventListener("submit", async e => {
          e.preventDefault();
          const match = await reveal(document.getElementById("code").value);
          document.getElementById("answer").textContent = match
            ? `Salut ${match.gifter}, vous avez choisi ${match.recipient}.`
            : "code non reconnue";
          document.getElementById("bow").hidden = !match;
        });
      });
      </script>
  </head>
  <body>
    <div>
      <h2 class="title">santa secret</h2>
      <div class="mobile-art">
        <img src="assets/skeleton_key.png" alt="stars">
        <img src="assets/rosary_hands.png" alt="tree">
      </div>
      <div class="layout">
        <img class="stars" src="assets/skeleton_key.png" alt="stars">
        <form id="form">
          <label style="margin: 1em 0;">Saisissez votre code unique: <input id="code" autocomplete="off"></label>
          <button>Révéler</button>
        </form>
        <img class="tree" src="assets/rosary_hands.png" alt="tree">
      </div>
      <div class="answer-row">
        <p id="answer"></p>
        <img id="bow" src="assets/praying_santa.png" alt="bow" hidden>
      </div>
    </div>
  </body>
</html>
