<!DOCTYPE html>

<html lang="en">
  <head>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
      const BLOBS = [
        "7vIB0yVRC09rxXduFDB8Ig7ia4B5y18Uf7oS7SSXLi5OxbaDdShVBNO+IdYWF+dZFYxOc0vZbk42XIyr",
        "t2bDCM9gcCbM8AndQzSzvGL+cxa6odRqNhYhvxvt8YZMIyVA5pExI+ua1xpz782ovnrrSvtg57+loZoP",
        "/YTrWtL3f5qzYWt2n9zNaKU9Uj2q77lLb6xY6VEwV5GVvu6jDSDc6d/VIU9VxAAbzNvXsj1XEm3HYcRr",
        "hv/UxdYD+1ViIVk5lCG4BxdPGbYld8zW5V3uWG7iOLkI5m5DhITbb8fMQL6kqYXUWcxZEsIwfH2p7sp2",
        "gz57BsCjFxn09F/G+MhWx1bL/NftTxOWVP5cGnAC2sSAcSbTmODabWOhnsAVrOzHdC60qHQtJOEJodi/",
        "W1IZyNHdZ9WY4LVhbRjarNd8fefPTDb23T84QvOXwtGvo7R5SPBUnP1NKtBo7X1eQ2fCJzHmwMLCfq2T",
        "DC7t8ipJ5yoAkTNHbc80CbpsSC+IOYOMchTTEZl1Hn8X2dj9L4ZOzqKXMt/uq8Va46EmRM6cpALJaW6l",
        "FFnG5qrO8vyDj6I94DTX3GC54XzCgrMGIiVhdA5EMxVYKGPm0GsE+eqFzqVcRPABLkvhGM+yQ0F3RjgO"
      ];

      function normalize(code) {
        return code.toUpperCase().replace(/[\s-]/g, "");
      }

      function fromBase64(s) {
        return Uint8Array.from(atob(s), c => c.charCodeAt(0));
      }

      async function keyFromCode(code) {
        const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(normalize(code)));
        return crypto.subtle.importKey("raw", hash, "AES-GCM", false, ["decrypt"]);
      }

      // try the code against every blob; AES-GCM only accepts the right key
      async function reveal(code) {
        const key = await keyFromCode(code);
        for (const blob of BLOBS) {
          const bytes = fromBase64(blob);
          try {
            const plain = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
            const [gifter, recipient] = new TextDecoder().decode(plain).replace(/\0+$/, "").split("\n");
            return { gifter, recipient };
          } catch {
            // not this person's blob, try the next one
          }
        }
        return null;
      }

      // this script is in <head>, so wait for the form to exist
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("form").addEventListener("submit", async e => {
          e.preventDefault();
          const match = await reveal(document.getElementById("code").value);
          document.getElementById("answer").textContent = match
            ? `Hey ${match.gifter}, you picked ${match.recipient}.`
            : "code not recognized";
          document.getElementById("bow").hidden = !match;
        });
      });
      </script>
  </head>
  <body>
    <div>
      <h2 style="margin: 2em 0">very secret santa</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1em;">
        <img src="assets/stars.svg" alt="stars">
        <form id="form">
          <label style="margin: 1em 0;">Enter your unique code: <input id="code" autocomplete="off"></label>
          <button>reveal</button>
        </form>
        <img src="assets/tree.svg" alt="tree">
      </div>
      <div class="answer-row">
        <p id="answer"></p>
        <img id="bow" src="assets/bow.svg" alt="bow" hidden>
      </div>
    </div>
  </body>
</html>
