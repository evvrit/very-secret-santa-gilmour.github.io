<!DOCTYPE html>

<html lang="en">
  <head>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
      const BLOBS = [
        "ww/7GzyRuDVusQr81yfseM52BGb80VjHf/iKVLgRAbTDj3SXU98PwZh02baDLhm5KEsWApR444PMwaRR",
        "JC68aiQtp5KDL7+td3Pb4aPWDwYvMbt/ct4XHsRWwdaLx1B7iAlmIVKaXW+a7H8K9mhZDnNB2fzexabN",
        "Cv0pES8T7Ua5Z7jwAku7zjwi1AUKhl1h/pItMHvTA9JSKo6ze1Yxtlf64F8zzmLFio4f8m3lsPlMG0TA",
        "+h0x2eVUFKlGDG7H5pEsSH1oxyvaEkphIQ2PLPX4BwmPJ6Y6CYASWuSKadyNF4+8c9n6IUUoZPd87tzC",
        "1c6grX51VCvUFPGQeMAMmIY5mJTvhHW5XJjNjUoCX+GvqkbiMIjKaKIFQ7q/ILmcp5UAI/9mUP5ezk3d",
        "AvJjQmKEytkpRDqavM8qyxJkE7OiPT0suAgQd956TfY5i841mTK0Mi7OJcwGpd/hbxWXrvl0+k/fI12o",
        "Jee0DL6GHn0hKWvlPN8kUW2T3fJYwQ6DVEUSN8G1L0A23DBAxaP7rzYacWeUvplqgFpoEW+QBKMmovq2",
        "81M5rPZdeKcsUZpS5k3CUtIRBnrCYjvJDjK7nPr+WXKNfQUhT4UkR+EHQ+GuisQ3XxGeXxt2dq3gDzqb"
      ];

      function normalize(code) {
        return code.toUpperCase().replace(/[\s-]/g, "");
      }

      function fromBase64(s) {
        return Uint8Array.from(atob(s), c => c.charCodeAt(0));
      }

      async function keyFromCode(code) {
        const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(normalize(code)));
        return crypto.subtle.importKey("raw", hash, "AES-GCM", false, ["decrypt"]);
      }

      // try the code against every blob; AES-GCM only accepts the right key
      async function reveal(code) {
        const key = await keyFromCode(code);
        for (const blob of BLOBS) {
          const bytes = fromBase64(blob);
          try {
            const plain = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
            const [gifter, recipient] = new TextDecoder().decode(plain).replace(/\0+$/, "").split("\n");
            return { gifter, recipient };
          } catch {
            // not this person's blob, try the next one
          }
        }
        return null;
      }

      // this script is in <head>, so wait for the form to exist
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("form").addEventListener("submit", async e => {
          e.preventDefault();
          const match = await reveal(document.getElementById("code").value);
          document.getElementById("answer").textContent = match
            ? `Hey ${match.gifter}, you picked ${match.recipient}.`
            : "code not recognized";
        });
      });
      </script>
  </head>
  <body>
    <div>
      <h2>very secret santa</h2>
      <div style="display: grid; grid-template-columns: 1fr 50% 1fr">
        <img src="assets/stars.svg" alt="stars">
        <form id="form">
          <label>enter your unique code: <input id="code" autocomplete="off"></label>
          <button>reveal</button>
        </form>
        <img src="assets/tree.svg" alt="tree">
      </div>
      <p id="answer"></p>
    </div>
  </body>
</html>
